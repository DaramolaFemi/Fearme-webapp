name: Portfolio curation check

on:
  push:
    branches:
      - portfolio-curation-flux-immortal

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: test-results
          if-no-files-found: ignore
