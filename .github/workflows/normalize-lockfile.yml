name: Normalize package lock

on:
  push:
    branches:
      - chatgpt/normalize-lockfile
    paths:
      - .github/workflows/normalize-lockfile.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/normalize-lockfile

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Normalize package lock"
          git push origin HEAD:chatgpt/normalize-lockfile
